# 云编译公用核心
name: WRT-核心

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_DEVICE:
        required: false
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_DEVICE: ${{inputs.WRT_DEVICE}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: 检出项目
        uses: actions/checkout@main

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: 初始化编译变量
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[\w]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"

          BRANCH_CLEAN=${WRT_BRANCH#openwrt-}
          VER_PART=${BRANCH_CLEAN%%-*}
          KERNEL_PART=${BRANCH_CLEAN#*-}
          KERNEL_MAJOR=${KERNEL_PART%%.*}
          WRT_SHORT_VERSION="${VER_PART}.${KERNEL_MAJOR}"

          # 根据 WRT_DEVICE 自动推断简短设备名
          if [[ "$WRT_DEVICE" == *"wr30u"* ]]; then
            WRT_DEVICE_SHORT="WR30U"
          elif [[ "$WRT_DEVICE" == *"ax3000t"* ]]; then
            WRT_DEVICE_SHORT="AX3000T"
          elif [ -n "$WRT_DEVICE" ]; then
            WRT_DEVICE_SHORT="$WRT_DEVICE"
          else
            WRT_DEVICE_SHORT="$WRT_NAME"
          fi

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_WIFI=wifi-yes"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
            echo "WRT_SHORT_VERSION=$WRT_SHORT_VERSION"
            echo "WRT_DEVICE_SHORT=$WRT_DEVICE_SHORT"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: 克隆源码
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          if [ ! -d "defconfig" ]; then
            echo "defconfig directory not found, stopping workflow."
            exit 0
          fi

          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: 检查脚本
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: 恢复编译缓存
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: 准备恢复的编译缓存
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "已恢复编译缓存：${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: 更新软件源
        run: |
          cd ./wrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 自定义软件包
        run: |
          cd ./wrt/package/
          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: 应用自定义配置
        run: |
          cd ./wrt/

          rm -f .config

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          export DEVICE="${WRT_DEVICE:-}"

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc) 2>&1 | tee /tmp/defconfig.log || true

          if [ -n "$WRT_DEVICE" ]; then
            echo "===== 强制写回目标机型: $WRT_DEVICE ====="

            sed -i '/^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/d' .config
            sed -i '/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_/d' .config
            sed -i '/^# CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/d' .config

            echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${WRT_DEVICE}=y" >> .config
            echo "CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_${WRT_DEVICE}=\"\"" >> .config

            sed -i '/^CONFIG_TARGET_MULTI_PROFILE=/d' .config
            sed -i '/^CONFIG_TARGET_PER_DEVICE_ROOTFS=/d' .config
            echo "CONFIG_TARGET_MULTI_PROFILE=y" >> .config
            echo "CONFIG_TARGET_PER_DEVICE_ROOTFS=y" >> .config

            echo "===== 当前生效的设备 ====="
            grep "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_" .config

            if [ -z "$(grep "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_" .config)" ]; then
              echo "❌ 错误：没有匹配到任何设备，请检查 WRT_DEVICE 的值！"
              exit 1
            fi
          fi

          make clean -j$(nproc)

      - name: 下载源码包
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          make download -j8

      - name: 编译固件
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          make -j8 V=s || make -j1 V=s

      - name: 保存编译缓存
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: 机器信息
        run: |
          cd ./wrt/
          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: 编译后版本校验
        if: ${{ !inputs.WRT_TEST }}
        working-directory: ./wrt
        run: |
          echo "==== profiles.json 版本 ===="
          cat bin/targets/*/*/profiles.json 2>/dev/null | grep version_number || echo "profiles.json 未找到"
          echo "==== openwrt_release ===="
          cat package/base-files/files/etc/openwrt_release 2>/dev/null || echo "openwrt_release 未找到"
          echo "==== 固件目录根目录列表 ===="
          ls -lh bin/targets/mediatek/filogic/ 2>/dev/null || echo "固件目录未找到"
          echo "==== Packages.manifest 位置 ===="
          find bin/targets/mediatek/filogic/ -name "Packages.manifest" -exec ls -lh {} \; 2>/dev/null || echo "Packages.manifest 未找到"

      - name: 打包固件
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/ && mkdir -p ./upload/

          # 1. 导出配置文本
          cp -f ./.config ./upload/Config-"$WRT_DEVICE_SHORT"-"$WRT_CONFIG"-"$WRT_SHORT_VERSION".txt

          # 2. 提取内核版本和插件列表
          echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \; | head -n1)" >> $GITHUB_ENV
          echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

          # 3. 抓取根目录所有文件
          echo "===== 抓取前，固件目录根目录内容 ====="
          ls -lh ./bin/targets/mediatek/filogic/
          find ./bin/targets/mediatek/filogic/ -maxdepth 1 -type f -exec cp -f {} ./upload/ \;

          # 4. 抓取 Packages.manifest（子目录里）
          PKG_MANIFEST=$(find ./bin/targets/mediatek/filogic/ -type f -name "Packages.manifest" | head -n1)
          [ -n "$PKG_MANIFEST" ] && cp -f "$PKG_MANIFEST" ./upload/

          # 5. 剔除无关的 target 级 manifest
          rm -f ./upload/immortalwrt-mediatek-filogic.manifest

          # 6. 从 opkg status 强制生成设备专属 manifest
          TARGET_MANIFEST="./upload/immortalwrt-mediatek-filogic-${WRT_DEVICE}.manifest"
          echo ""
          echo "===== 强制生成设备专属 manifest ====="
          STATUS_FILE=$(find ./build_dir -type f -path "*root-mediatek/usr/lib/opkg/status" 2>/dev/null | head -n1)
          if [ -z "$STATUS_FILE" ]; then
            STATUS_FILE=$(find ./build_dir -type f -path "*/usr/lib/opkg/status" 2>/dev/null | head -n1)
          fi
          if [ -n "$STATUS_FILE" ]; then
            echo "✅ 找到 opkg status: $STATUS_FILE"
            awk '
              /^Package:/ { pkg=$2 }
              /^Version:/ { ver=$2; if (pkg != "" && ver != "") print pkg" - "ver }
            ' "$STATUS_FILE" | sort > "$TARGET_MANIFEST"
            echo "✅ 已生成设备专属 manifest，共 $(wc -l < "$TARGET_MANIFEST") 个包"
            head -10 "$TARGET_MANIFEST"
          else
            echo "⚠️ 找不到 opkg status 文件"
            [ -f "./upload/Packages.manifest" ] && cp -f ./upload/Packages.manifest "$TARGET_MANIFEST"
          fi

          # 7. 校验 sha256sums
          if [ ! -f "./upload/sha256sums" ]; then
            (cd ./upload/ && sha256sum *.bin *.ubi *.itb *.fip 2>/dev/null > sha256sums || true)
          fi

          make clean -j$(nproc)

          echo ""
          echo "==== 最终 upload 目录内容 ===="
          ls -lh ./upload/

      - name: 发布固件
        uses: softprops/action-gh-release@master
        with:
          tag_name: ImmortalWrt-${{ env.WRT_DEVICE_SHORT }}-${{ env.WRT_CONFIG }}-${{ env.WRT_SHORT_VERSION }}-${{ env.WRT_DATE }}
          name: "ImmortalWrt-${{ env.WRT_DEVICE_SHORT }}-${{ env.WRT_SHORT_VERSION }}-${{ env.WRT_DATE }}"
          files: |
            ./wrt/upload/*.bin
            ./wrt/upload/*.ubi
            ./wrt/upload/*.itb
            ./wrt/upload/*.fip
            ./wrt/upload/*.manifest
            ./wrt/upload/*.json
            ./wrt/upload/*.sha256sums
            ./wrt/upload/*.buildinfo
            ./wrt/upload/Config-*.txt
          body: |
            # ImmortalWrt | ${{ env.WRT_DEVICE_SHORT }} (${{ env.WRT_CONFIG }}) - ${{ env.WRT_SHORT_VERSION }}

            **编译时间**：${{ env.WRT_DATE }}
            **目标设备**：${{ inputs.WRT_DEVICE }}

            ## 📋 固件信息
            | 项目 | 值 |
            |------|-----|
            | **设备** | ${{ inputs.WRT_DEVICE || '全设备' }} |
            | **配置** | ${{ env.WRT_CONFIG }} |
            | **精简版本** | ${{ env.WRT_SHORT_VERSION }} |
            | **内核版本** | ${{ env.WRT_KVER }} |
            | **登录地址** | ${{ env.WRT_IP }} |
            | **登录密码** | ${{ env.WRT_PW }} |
            | **WIFI名称** | ${{ env.WRT_SSID }} |
            | **WIFI密码** | ${{ env.WRT_WORD }} |

            ## 📥 下载指引
            *   **主固件（系统内升级）**：`*-squashfs-sysupgrade.bin` 或 `*-squashfs-sysupgrade.itb`
            *   **过渡固件（Uboot/救砖）**：`*-initramfs-factory.ubi`、`*-initramfs-kernel.bin`
            *   **底层引导文件（按需刷写）**：`*-bl2.bin`、`preloader.bin`、`*-uboot.fip`
            *   **软件包清单**：`Packages.manifest`、`immortalwrt-*-${WRT_DEVICE}.manifest`

            ## ⚠️ 刷机提示
            > 刷机有风险，注意备份文件数据，请务必在早上或晚上刷机。
            > 如果刷了 H大 uboot，**只能选择默认分区**，不支持 `immortalwrt-112m` 和 `qwrt` 布局。

            ## 📦 插件列表
            ${{ env.WRT_LIST }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}