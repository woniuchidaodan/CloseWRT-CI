name: WRT-核心

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_DEVICE:
        required: false
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_DEVICE: ${{inputs.WRT_DEVICE}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: 检出项目
        uses: actions/checkout@main

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: 初始化编译变量
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[\w]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"

          BRANCH_CLEAN=${WRT_BRANCH#openwrt-}
          VER_PART=${BRANCH_CLEAN%%-*}
          KERNEL_PART=${BRANCH_CLEAN#*-}
          KERNEL_MAJOR=${KERNEL_PART%%.*}
          WRT_SHORT_VERSION="${VER_PART}.${KERNEL_MAJOR}"

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_WIFI=wifi-yes"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
            echo "WRT_SHORT_VERSION=$WRT_SHORT_VERSION"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: 克隆源码
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          if [ ! -d "defconfig" ]; then
            echo "defconfig directory not found, stopping workflow."
            exit 0
          fi

          if [[ "$WRT_SOURCE" == "padavanonly/immortalwrt-mt798x-6.6" ]]; then
            echo "===== 237 源码，强制清理并补充配套 dl 包（20231229 版本） ====="
            mkdir -p dl

            find dl/ -type f \( -name "*warp*" -o -name "*mt79*" -o -name "*mt798*" -o -name "*datconf*" \) -delete 2>/dev/null || true

            DL_BASE="https://github.com/padavanonly/immortalwrt-mt798x-6.6/raw/mt798x-mt799x-6.6-mtwifi/dl"

            wget -O dl/mt79xx_conninfra_20231229-f2fa25.tar.xz "$DL_BASE/mt79xx_conninfra_20231229-f2fa25.tar.xz" || { echo "❌ conninfra 下载失败"; exit 1; }
            wget -O dl/warp_20231229-5f71ec.tar.xz "$DL_BASE/warp_20231229-5f71ec.tar.xz" || { echo "❌ warp 下载失败"; exit 1; }
            wget -O dl/datconf-757f9679.tar.bz2 "$DL_BASE/datconf-757f9679.tar.bz2" || { echo "❌ datconf 下载失败"; exit 1; }
            wget -O dl/mt79xx_20231229-4012a0.tar.xz "$DL_BASE/mt79xx_20231229-4012a0.tar.xz" || { echo "❌ mt_wifi 主驱动下载失败"; exit 1; }

            ls -lh dl/ | grep -E "conninfra|mt79xx|warp|datconf"

            HASH_WARP=$(sha256sum dl/warp_20231229-5f71ec.tar.xz | cut -d ' ' -f 1)
            HASH_MTWIFI=$(sha256sum dl/mt79xx_20231229-4012a0.tar.xz | cut -d ' ' -f 1)
            HASH_DATCONF=$(sha256sum dl/datconf-757f9679.tar.bz2 | cut -d ' ' -f 1)

            fix_makefile() {
              local file=$1
              local version=$2
              local source=$3
              local hash=$4
              awk -v ver="$version" -v src="$source" -v h="$hash" '
                /^PKG_VERSION:=/ { print "PKG_VERSION:=" ver; next }
                /^PKG_SOURCE:=/ { next }
                /^PKG_HASH:=/ { next }
                /^PKG_SOURCE_URL:=/ { next }
                /include \$\(INCLUDE_DIR\)\/package\.mk/ && !done {
                  print "PKG_SOURCE:=" src
                  print "PKG_HASH:=" h
                  print "PKG_SOURCE_URL:=file://$(TOPDIR)/dl"
                  done = 1
                }
                { print }
              ' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
            }

            fix_makefile "./package/mtk/drivers/warp/Makefile" "20231229-5f71ec" "warp_20231229-5f71ec.tar.xz" "$HASH_WARP"
            fix_makefile "./package/mtk/drivers/mt_wifi/Makefile" "20231229-4012a0" "mt79xx_20231229-4012a0.tar.xz" "$HASH_MTWIFI"
            fix_makefile "./package/mtk/applications/datconf/Makefile" "757f9679" "datconf-757f9679.tar.bz2" "$HASH_DATCONF"

            echo "===== 修复 conninfra 源码（追加覆盖 + 保留 Makefile） ====="
            CONNINFRA_DIR="./package/mtk/drivers/conninfra"

            # 备份 237 原生 Makefile
            cp "$CONNINFRA_DIR/src/Makefile" /tmp/conninfra_Makefile.bak

            # 解压 tarball 到临时目录
            mkdir -p /tmp/conninfra_extract
            tar -xf dl/mt79xx_conninfra_20231229-f2fa25.tar.xz -C /tmp/conninfra_extract --strip-components=1

            # 追加覆盖（不删除原文件，保留 Makefile 及头文件）
            cp -rf /tmp/conninfra_extract/* "$CONNINFRA_DIR/src/"

            # 恢复原生 Makefile
            cp /tmp/conninfra_Makefile.bak "$CONNINFRA_DIR/src/Makefile"

            # 6.6 内核里 struct timeval 已改名，全局替换
            find "$CONNINFRA_DIR/src/" -type f \( -name "*.c" -o -name "*.h" \) \
              -exec sed -i 's/struct timeval/struct __kernel_old_timeval/g' {} \;

            # 给 EXTRA_CFLAGS 追加 -Wno-error，防止警告升级为错误
            sed -i 's|^EXTRA_CFLAGS+=-DEEPROM_NAME=|EXTRA_CFLAGS+=-Wno-error -DEEPROM_NAME=|' "$CONNINFRA_DIR/Makefile"

            rm -rf /tmp/conninfra_extract

            echo "===== conninfra 修复结果 ====="
            ls "$CONNINFRA_DIR/src/" | head -5
            grep -n "EXTRA_CFLAGS" "$CONNINFRA_DIR/Makefile"
          else
            echo "===== 非 237 源码，跳过 dl 补充 ====="
          fi

          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: 检查脚本
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: 恢复编译缓存
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: 准备恢复的编译缓存
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "已恢复编译缓存：${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: 更新软件源
        run: |
          cd ./wrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 自定义软件包
        run: |
          cd ./wrt/package/
          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: 应用自定义配置
        run: |
          cd ./wrt/

          rm -f .config

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          export DEVICE="${WRT_DEVICE:-}"

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc) 2>&1 | tee /tmp/defconfig.log || true

          if [ -n "$WRT_DEVICE" ]; then
            echo "===== 强制写回目标机型: $WRT_DEVICE ====="

            sed -i '/^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/d' .config
            sed -i '/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_/d' .config
            sed -i '/^# CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/d' .config

            echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${WRT_DEVICE}=y" >> .config
            echo "CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_${WRT_DEVICE}=\"\"" >> .config

            sed -i '/^CONFIG_TARGET_MULTI_PROFILE=/d' .config
            sed -i '/^CONFIG_TARGET_PER_DEVICE_ROOTFS=/d' .config
            echo "CONFIG_TARGET_MULTI_PROFILE=y" >> .config
            echo "CONFIG_TARGET_PER_DEVICE_ROOTFS=y" >> .config

            grep "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_" .config

            if [ -z "$(grep "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_" .config)" ]; then
              echo "❌ 错误：没有匹配到任何设备，请检查 WRT_DEVICE 的值！"
              exit 1
            fi
          fi

          make clean -j$(nproc)

      - name: 下载源码包
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          make download -j$(nproc)

      - name: 编译固件
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          make -j$(nproc) || make -j1 V=s

      - name: 保存编译缓存
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: 机器信息
        run: |
          cd ./wrt/
          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: 编译后版本校验
        if: ${{ !inputs.WRT_TEST }}
        working-directory: ./wrt
        run: |
          echo "==== profiles.json 版本 ===="
          cat bin/targets/*/*/profiles.json 2>/dev/null | grep version_number || echo "profiles.json 未找到"
          echo "==== openwrt_release ===="
          cat package/base-files/files/etc/openwrt_release 2>/dev/null || echo "openwrt_release 未找到"
          echo "==== 固件列表（原始） ===="
          ls -lh bin/targets/mediatek/filogic/ 2>/dev/null || echo "固件目录未找到"

      - name: 打包固件
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/ && mkdir -p ./upload/

          cp -f ./.config ./upload/Config-"$WRT_NAME"-"$WRT_CONFIG"-"$WRT_SHORT_VERSION".txt

          echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \; | head -n1)" >> $GITHUB_ENV
          echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

          find ./bin/targets/ -type f \( -name "*sysupgrade.bin" -o -name "*factory.ubi" -o -name "*kernel.bin" -o -name "*.itb" -o -name "*.fip" -o -name "preloader.bin" -o -name "*.json" -o -name "*.sha256sums" -o -name "*-bl2.bin" \) -exec mv -f {} ./upload/ \;

          if [ -n "$WRT_DEVICE" ]; then
            find ./bin/targets/ -type f -name "*${WRT_DEVICE}*.manifest" -exec mv -f {} ./upload/ \;
          else
            find ./bin/targets/ -type f -name "*.manifest" -exec mv -f {} ./upload/ \;
          fi

          make clean -j$(nproc)

          ls -lh ./upload/

      - name: 发布固件
        uses: softprops/action-gh-release@master
        with:
          tag_name: ImmortalWrt-${{ env.WRT_NAME }}-${{ env.WRT_CONFIG }}-${{ env.WRT_SHORT_VERSION }}
          name: "ImmortalWrt-${{ env.WRT_NAME }}-${{ env.WRT_SHORT_VERSION }}"
          files: |
            ./wrt/upload/*.bin
            ./wrt/upload/*.ubi
            ./wrt/upload/*.itb
            ./wrt/upload/*.fip
            ./wrt/upload/*.manifest
            ./wrt/upload/*.json
            ./wrt/upload/*.sha256sums
            ./wrt/upload/Config-*.txt
          body: |
            # ImmortalWrt | ${{ env.WRT_NAME }} (${{ env.WRT_CONFIG }}) - ${{ env.WRT_SHORT_VERSION }}

            ## 📋 固件信息
            | 项目 | 值 |
            |------|-----|
            | **设备** | ${{ inputs.WRT_DEVICE || '全设备' }} |
            | **配置** | ${{ env.WRT_CONFIG }} |
            | **精简版本** | ${{ env.WRT_SHORT_VERSION }} |
            | **内核版本** | ${{ env.WRT_KVER }} |
            | **登录地址** | ${{ env.WRT_IP }} |
            | **登录密码** | ${{ env.WRT_PW }} |
            | **WIFI名称** | ${{ env.WRT_SSID }} |
            | **WIFI密码** | ${{ env.WRT_WORD }} |

            ## 📥 下载指引
            由于不同机型的分区布局不同，释放出的文件后缀也会有所差异，请根据您的机型选择：

            *   **主固件（系统内升级）**：`*-squashfs-sysupgrade.bin` 或 `*-squashfs-sysupgrade.itb`
            *   **过渡固件（Uboot/救砖）**：`*-initramfs-factory.ubi`、`*-initramfs-kernel.bin`、`*-initramfs-recovery.itb`
            *   **底层引导文件（按需刷写）**：`*-bl2.bin`、`preloader.bin`、`*-uboot.fip`、`*-bl31-uboot.fip`
            *   **系统识别与校验文件（请勿修改文件名）**：`profiles.json`、`index.json`、`*.manifest`、`*.sha256sums`

            ## 📝 默认配置
            - **IP 地址**: `${{ env.WRT_IP }}`
            - **主机名**: `${{ env.WRT_NAME }}`
            - **Wi-Fi SSID**: `${{ env.WRT_SSID }}`
            - **Wi-Fi 密码**: `${{ env.WRT_WORD }}`

            ## ⚠️ 刷机提示
            > 刷机有风险，注意备份文件数据，请务必在早上或晚上刷机。
            > 如果刷了 H大 uboot，**只能选择默认分区**，不支持 `immortalwrt-112m` 和 `qwrt` 布局。
            > 💡 刷机后请进入 **网络 → TurboACC**，全锥形 NAT 选择“兼容”模式。

            ## 📦 插件列表
            ${{ env.WRT_LIST }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
