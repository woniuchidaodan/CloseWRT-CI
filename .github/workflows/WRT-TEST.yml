# CI项目
name: WRT-测试编译

# CI计划
on:
  # 手动编译
  workflow_dispatch:
    inputs:
      DEVICE:
        description: '选择目标机型'
        type: choice
        options:
          - xiaomi_mi-router-wr30u-ubootmod
          - xiaomi_mi-router-wr30u-stock
          - xiaomi_mi-router-ax3000t
          - xiaomi_mi-router-ax3000t-stock
          - xiaomi_mi-router-ax3000t-mtkuboot
        default: xiaomi_mi-router-wr30u-ubootmod
      CONFIG:
        description: '编译配置'
        default: 'MT7981'
        required: true
        type: choice
        options:
          - MT7981
          - MT7986
          - TEST
      SOURCE:
        description: '源码仓库'
        default: 'Yuzhii0718/immortalwrt-mt798x-6.6-padavanonly'
        required: true
        type: choice
        options:
          - Yuzhii0718/immortalwrt-mt798x-6.6-padavanonly
          - chasey-dev/immortalwrt-mt798x-rebase
          - padavanonly/immortalwrt-mt798x-6.6
      BRANCH:
        description: '源码分支'
        default: 'openwrt-24.10-6.6'
        required: true
        type: string
      PACKAGE:
        description: '手动调整插件包，多个请用换行符隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: true
        type: boolean

# CI权限
permissions: write-all

# CI任务
jobs:
  config:
    name: ${{inputs.DEVICE}}
    # 调用公用编译核心 WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      # 编译配置
      WRT_CONFIG: ${{inputs.CONFIG}}
      # 目标机型
      WRT_DEVICE: ${{inputs.DEVICE}}
      # 默认主题
      WRT_THEME: aurora
      # 默认主机名（会被 Settings.sh 覆盖）
      WRT_NAME: WR30U
      # 默认WIFI名称
      WRT_SSID: CMCC-7920
      # 默认WIFI密码
      WRT_WORD: 123456789
      # 默认地址
      WRT_IP: 192.168.1.2
      # 默认密码，仅作提示，修改无用
      WRT_PW: 无
      # 源码链接
      WRT_REPO: https://github.com/${{inputs.SOURCE}}.git
      # 源码分支
      WRT_BRANCH: ${{inputs.BRANCH}}
      # 源码名称
      WRT_SOURCE: ${{inputs.SOURCE}}
      # 插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      # 仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
